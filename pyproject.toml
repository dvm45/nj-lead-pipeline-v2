[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "njlead"
version = "1.0.0"
description = "NJ school lead testing PDF extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rapidfuzz>=3.0",
    "openpyxl>=3.1",
    "anthropic[bedrock]>=0.40",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
]

# This registers `njlead` as a command-line tool.
# After `pip install -e .`, you can type `njlead` in the terminal.
[project.scripts]
njlead = "njlead.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["njlead*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["nj_lead_pipeline_v2/", "export_paterson_*.py", "qaqc_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
